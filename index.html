<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truth Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #e2e8f0; font-family: monospace; height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    
    .card { 
      width: 100%; 
      max-width: 860px; 
      border: 1px solid rgba(250,204,21,.15); 
      border-radius: 8px; 
      display: flex; 
      flex-direction: column; 
      height: calc(100dvh - 32px); 
      background: #0d0d0d;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .card:focus-within {
      border-color: rgba(250,204,21,.4);
      box-shadow: 0 0 20px rgba(250,204,21,.03);
    }

    .header { 
      padding: 14px 20px; 
      font-size: 14px; 
      border-bottom: 1px solid rgba(250,204,21,.15); 
      color: #facc15; 
      letter-spacing: 2px; 
      text-transform: uppercase; 
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header::after {
      content: "SYS_STATUS: ACTIVE";
      font-size: 11px;
      opacity: 0.7;
    }

    .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(250,204,21,.2); border-radius: 4px; }
    
    .interaction-block { 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      border-bottom: 1px solid rgba(255,255,255,.03);
      padding-bottom: 20px;
      opacity: 0;
      transform: translateY(4px);
      animation: fadeIn 0.25s forwards ease-out;
    }
    .interaction-block:last-child { border-bottom: none; padding-bottom: 0; }
    
    .prompt-line { 
      color: #facc15; 
      font-weight: bold; 
      font-size: 14px; 
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .prompt-line::before {
      content: "❯";
      color: #facc15;
    }
    
    .report-body { 
      line-height: 1.7; 
      font-size: 14px; 
      color: #cbd5e1;
      padding-left: 18px;
      word-break: break-word;
    }
    
    .thinking-line { 
      color: #facc15; 
      font-style: italic; 
      font-size: 13px; 
      animation: pulse 1.5s infinite; 
      padding-left: 18px;
    }
    
    .report-body p { margin-bottom: 12px; }
    .report-body p:last-child { margin-bottom: 0; }
    .report-body h1, .report-body h2, .report-body h3 { color: #facc15; margin: 18px 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
    .report-body ul, .report-body ol { padding-left: 18px; margin-bottom: 12px; }
    .report-body li { margin-bottom: 4px; }
    .report-body code { background: rgba(250,204,21,.08); padding: 2px 5px; border-radius: 3px; font-size: 12px; color: #facc15; }
    .report-body pre { background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.05); border-radius: 6px; padding: 14px; overflow-x: auto; margin: 14px 0; }
    .report-body pre code { background: none; padding: 0; color: #a7f3d0; }
    .report-body blockquote { border-left: 2px solid #facc15; padding-left: 12px; color: #94a3b8; margin: 12px 0; font-style: italic; }
    .report-body strong { color: #facc15; font-weight: bold; }
    
    .meta-row { display: flex; justify-content: flex-end; padding-left: 18px; margin-top: 4px; }
    .copy-btn { font-size: 11px; color: #475569; background: none; border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: all .2s; font-family: monospace; }
    .copy-btn:hover { color: #facc15; background: rgba(250,204,21,.05); }
    .copy-btn.copied { color: #22c55e; }
    
    @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
    @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
    
    .input-row { display: flex; gap: 12px; padding: 16px 24px; border-top: 1px solid rgba(250,204,21,.15); flex-shrink: 0; align-items: flex-end; background: #0a0a0a; border-radius: 0 0 8px 8px; }
    textarea { flex: 1; background: rgba(255,255,255,.02); border: 1px solid rgba(250,204,21,.2); border-radius: 6px; color: #fff; padding: 12px; font-family: monospace; font-size: 14px; resize: none; outline: none; min-height: 44px; max-height: 160px; overflow-y: auto; line-height: 1.5; transition: border-color .2s, background .2s; }
    textarea:focus { border-color: #facc15; background: rgba(255,255,255,.04); }
    
    .send-btn { background: #facc15; color: #000; border: none; border-radius: 6px; width: 64px; height: 44px; font-size: 13px; font-weight: bold; cursor: pointer; flex-shrink: 0; display: grid; place-items: center; transition: background .2s; font-family: monospace; }
    .send-btn:hover { background: #fde047; }
    .send-btn:disabled { opacity: .2; cursor: not-allowed; background: #facc15; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">Truth Engine</div>
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <textarea id="input" placeholder="Enter query parameters..." rows="1"
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
      <button class="send-btn" id="btn" onclick="send()">RUN</button>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://orproxy.ai-n.workers.dev";
    const messages = [];
    marked.setOptions({ breaks: true });

    function scrollToBottom(container, force = false) {
      const isAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight <= 60;
      if (force || isAtBottom) {
        container.scrollTop = container.scrollHeight;
      }
    }

    async function send() {
      const input = document.getElementById("input");
      const btn = document.getElementById("btn");
      const msgBox = document.getElementById("messages");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      input.style.height = "auto";
      btn.disabled = true;
      
      messages.push({ role: "user", content: text });

      const block = document.createElement("div");
      block.className = "interaction-block";

      const promptLine = document.createElement("div");
      promptLine.className = "prompt-line";
      promptLine.textContent = text;
      block.appendChild(promptLine);

      const thinkingLine = document.createElement("div");
      thinkingLine.className = "thinking-line";
      thinkingLine.textContent = "CRUNCHING_DATA...";
      block.appendChild(thinkingLine);

      msgBox.appendChild(block);
      scrollToBottom(msgBox, true);

      try {
        const res = await fetch(`${WORKER_URL}/api/generate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages, preset: "truth", stream: true })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        if (thinkingLine.parentNode) {
          thinkingLine.remove();
        }

        const reportBody = document.createElement("div");
        reportBody.className = "report-body";
        block.appendChild(reportBody);
        
        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        let fullText = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop(); 

          for (const line of lines) {
            const cleaned = line.trim();
            if (!cleaned || !cleaned.startsWith("data: ")) continue;
            
            const data = cleaned.slice(6).trim();
            if (data === "[DONE]") break;
            
            try {
              const json = JSON.parse(data);
              const delta = json.choices?.[0]?.delta?.content || "";
              if (delta) {
                fullText += delta;
                reportBody.innerHTML = marked.parse(fullText);
                scrollToBottom(msgBox);
              }
            } catch (e) {}
          }
        }

        if (buffer && buffer.startsWith("data: ")) {
          try {
            const data = buffer.slice(6).trim();
            if (data !== "[DONE]") {
              const json = JSON.parse(data);
              const delta = json.choices?.[0]?.delta?.content || "";
              if (delta) {
                fullText += delta;
                reportBody.innerHTML = marked.parse(fullText);
              }
            }
          } catch(e) {}
        }

        messages.push({ role: "assistant", content: fullText });

        const metaRow = document.createElement("div");
        metaRow.className = "meta-row";
        
        const copyBtn = document.createElement("button");
        copyBtn.className = "copy-btn";
        copyBtn.textContent = "[COPY_RECORD]";
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(reportBody.innerText).then(() => {
            copyBtn.textContent = "[COPIED]";
            copyBtn.classList.add("copied");
            setTimeout(() => { copyBtn.textContent = "[COPY_RECORD]"; copyBtn.classList.remove("copied"); }, 2000);
          });
        };
        
        metaRow.appendChild(copyBtn);
        block.appendChild(metaRow);
        scrollToBottom(msgBox, true);

      } catch (err) {
        if (thinkingLine && thinkingLine.parentNode) {
          thinkingLine.remove();
        }
        const errorLine = document.createElement("div");
        errorLine.className = "report-body";
        errorLine.style.color = "#ef4444";
        errorLine.textContent = "ERR_FAILURE: " + err.message;
        block.appendChild(errorLine);
      }

      btn.disabled = false;
      input.focus();
    }
  </script>
</body>
</html>
