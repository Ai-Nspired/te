<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Nspired :: Local Truth Engine Interface</title>
<meta name="description" content="ai-nspired.com • truth-engine. memory keeper. Systems that don’t forget—or flinch.">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&display=swap');

    /* --- Mode Variables --- */
    :root {
        /* Default Mode (Silvery) - Moderate Contrast */
        --bg-color: #f8f8ff;
        --text-color: #1a1a1a;
        --border-color: #d0d0d0;
        --modal-bg: #ffffff;
        --content-bg: #f8f8ff;
        --content-text: #1a1a1a;
        --accent-color: #1a2a3a;
        --secondary-text: #6c757d;
        --shadow-color: rgba(0,0,0,0.05);
        --accent-color-rgb: 26, 42, 58; /* RGB for 1a2a3a */
    }
    [data-mode="dark"] {
        /* Dark Mode - Soft Contrast (Opposite of Default) */
        --bg-color: #1a1a1a;
        --text-color: #f0f0f0;
        --border-color: #333333;
        --modal-bg: #2a2a2a;
        --content-bg: #111111;
        --content-text: #f0f0f0;
        --accent-color: #c7a17a; /* Warm beige/gold accent */
        --secondary-text: #9fa8da;
        --shadow-color: rgba(0,0,0,0.3);
        --accent-color-rgb: 199, 161, 122; /* RGB for c7a17a */
    }
    [data-mode="neo"] {
        /* Neo Mode - HIGH CONTRAST (Matrix Style) */
        --bg-color: #000000;            /* Pure black background */
        --text-color: #00FF00;          /* Neon green for terminal/main text */
        --border-color: #008800;        /* Darker green border */
        --modal-bg: #0d0d0d;            /* Near black modal frame */
        --content-bg: #1a1a1a;          /* Very dark gray for content background */
        --content-text: #00FF00;        /* NEON GREEN for result text */
        --accent-color: #00FF00;        /* BRIGHT GREEN for accents/borders/buttons */
        --secondary-text: #00AA00;      /* Slightly darker green for headers/secondary text */
        --shadow-color: transparent;
        --accent-color-rgb: 0, 255, 0; /* RGB for 00FF00 */
    }

    body {
        margin: 0;
        padding: 1.5rem 1rem;
        font-family: 'Crimson Pro', serif;
        font-size: 1.1rem;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
        transition: background-color 0.3s, color 0.3s;
        width: 100%;
        position: relative; /* For the history panel */
    }
    @media (max-width: 600px) {
        body { padding: 1rem 0.5rem; }
    }

    .terminal-window {
        width: 100%;
        max-width: 800px;
        text-align: left;
    }

    /* TYPING EFFECT */
    .typed-text {
        font-weight: 700;
        font-size: 1.5rem;
        display: inline-block;
        overflow: hidden;
        white-space: nowrap;
        width: 0; 
        border-right: 3px solid var(--accent-color);
        animation: blink-caret .75s step-end infinite;
    }
    .typed-text.is-typing {
        animation: typing 3.5s steps(40, end) forwards, blink-caret .75s step-end infinite;
    }
    .typed-text.is-done {
        animation: none;
        border-right: none; 
        width: auto;
    }

    @keyframes typing { from { width: 0 } to { width: 100% } }
    @keyframes blink-caret { 50% { border-color: transparent; } }

    .input-row {
        display: flex;
        align-items: center;
        margin-top: 1rem;
        width: 100%;
    }
    .command-line {
        display: flex;
        align-items: center;
        flex-grow: 1;
    }
    .command-line::before { content: '>'; margin-right: 1rem; font-weight: bold; }

    .search-input {
        background: transparent;
        border: none;
        color: var(--text-color);
        font-family: 'Crimson Pro', serif;
        font-size: 1.5rem;
        flex-grow: 1;
        outline: none;
        padding-right: 1rem;
    }
    .search-input:focus {
        outline: 2px solid var(--accent-color);
        outline-offset: 4px;
        border-radius: 2px;
    }
    .history-toggle {
        padding: 0.5rem 1rem;
        margin-left: 1rem;
        border: 1px solid var(--accent-color);
        background: none;
        color: var(--accent-color);
        font-weight: 700;
        cursor: pointer;
        border-radius: 4px;
        font-size: 0.9rem;
    }
    /* ... existing modal, result, and conversation block styles ... */
    
    .conversation-block .content {
        box-shadow: 0 4px 10px var(--shadow-color);
        margin-top: 1rem;
        transition: box-shadow 0.3s;
    }

    /* Neo Mode specific Content Glow */
    [data-mode="neo"] .conversation-block .content {
        box-shadow: 0 0 10px rgba(0, 255, 0, 0.6), 
                    0 0 20px rgba(0, 255, 0, 0.4), 
                    inset 0 0 5px rgba(0, 255, 0, 0.3);
    }
    
    /* --- History Panel Styles --- */
    #historyPanel {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        width: 300px;
        max-width: 80vw;
        background-color: var(--modal-bg);
        border-right: 1px solid var(--border-color);
        box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        transform: translateX(-100%);
        transition: transform 0.3s ease-in-out;
        z-index: 999;
        display: flex;
        flex-direction: column;
    }
    #historyPanel.open {
        transform: translateX(0);
    }

    .history-header {
        padding: 1rem;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        flex-direction: column; /* Stack header elements */
        gap: 0.75rem;
    }
    .history-title-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .history-header h2 {
        margin: 0;
        font-size: 1.2rem;
        color: var(--accent-color);
    }
    .history-actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
    }
    .history-actions button {
        background: none;
        border: 1px solid var(--accent-color);
        color: var(--accent-color);
        font-size: 0.8rem;
        padding: 0.25rem 0.5rem;
        cursor: pointer;
        border-radius: 4px;
        transition: background-color 0.2s, color 0.2s;
    }
    .history-actions button:hover {
        background-color: var(--accent-color);
        color: var(--bg-color);
    }
    .close-history {
        background: none;
        border: none;
        color: var(--accent-color);
        font-size: 1.5rem;
        cursor: pointer;
    }

    #historyList {
        flex-grow: 1;
        overflow-y: auto;
        padding: 1rem 0;
    }
    .history-item {
        padding: 0.75rem 1rem;
        cursor: pointer;
        border-bottom: 1px dashed var(--border-color);
        font-size: 0.9rem;
        transition: background-color 0.2s;
    }
    .history-item:hover {
        /* Use the CSS variable for dynamic hover color */
        background-color: rgba(var(--accent-color-rgb), 0.1); 
    }
    .history-item p {
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 700;
    }
    .history-item small {
        color: var(--secondary-text);
        font-size: 0.75rem;
        display: block;
        margin-top: 2px;
    }
    /* --- Other styles (omitted for brevity) remain the same --- */
    .modal-overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal-container {
        background-color: var(--modal-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        width: 95%; 
        max-width: 900px;
        height: 95vh;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        padding: 1rem 1rem;
        transition: background-color 0.3s, color 0.3s;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
    .modal-title { font-weight: 700; color: var(--accent-color); }
    .close-modal { background: none; border: none; color: var(--accent-color); font-size: 2rem; cursor: pointer; }
    .result-container {
        padding: 1rem 0;
        flex-grow: 1;
        overflow-y: auto;
        font-family: 'Crimson Pro', serif;
        color: var(--text-color);
        transition: background-color 0.3s, color 0.3s;
    }
    .citation-block { margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1rem; font-size: 0.9rem; }
    .citation-block a { color: var(--accent-color); text-decoration: none; }
    .citation-block a:hover { text-decoration: underline; }
    .modal-footer { display: flex; gap: 1rem; justify-content: flex-end; padding-top: 1rem; border-top: 1px solid var(--border-color); }
    .modal-footer button { 
        padding: 0.5rem 1rem; 
        border: 1px solid var(--accent-color); 
        background: none; 
        color: var(--accent-color); 
        font-weight: 700; 
        cursor: pointer; 
        border-radius: 4px;
        transition: background-color 0.2s, color 0.2s;
    }
    .modal-footer button:focus,
    .mode-toggle button:focus,
    .history-toggle:focus {
        background-color: var(--accent-color);
        color: var(--bg-color); 
        outline: 4px solid var(--accent-color);
        outline-offset: -2px;
    }
    .mode-toggle { 
        position: fixed; 
        top: 1rem; 
        right: 1rem; 
        display: flex; 
        gap: 0.5rem; 
        flex-wrap: wrap;
    }
    .mode-toggle button { 
        padding: 0.5rem 0.5rem;
        cursor: pointer; 
        border: 1px solid var(--accent-color); 
        background: none; 
        color: var(--accent-color); 
        font-weight: 700; 
        border-radius: 4px; 
        font-size: 0.8rem;
    }
    @media (max-width: 600px) {
        .mode-toggle { top: 0.5rem; right: 0.5rem; }
    }
    #customMessage {
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        background: var(--accent-color); 
        color: var(--bg-color);
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        opacity: 0;
        transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        pointer-events: none;
        z-index: 1001;
        font-weight: 700;
        font-size: 0.9rem;
    }
    [data-mode="neo"] #customMessage {
        color: #000000;
    }
    #customMessage.visible {
        opacity: 1;
        transform: translate(-50%, -10px);
    }
</style>
</head>
<body data-mode="silvery">

<div class="mode-toggle">
    <button onclick="setMode('silvery')">Default</button>
    <button onclick="setMode('dark')">Dark</button>
    <button onclick="setMode('neo')">Neo</button>
</div>

<div class="terminal-window">
    <p class="typed-text" id="typedText">connected. truth-engine ready.</p>
    <div class="input-row">
        <div class="command-line">
            <input type="text" class="search-input" id="queryInput" placeholder="Enter query..." autofocus>
        </div>
        <button class="history-toggle" id="historyToggle">History</button>
    </div>
</div>

<!-- History Panel -->
<div id="historyPanel">
    <div class="history-header">
        <div class="history-title-row">
            <h2>Local History</h2>
            <button class="close-history" id="closeHistoryBtn">×</button>
        </div>
        <div class="history-actions">
            <button onclick="exportHistoryToFile()">Export</button>
            <!-- Trigger the hidden file input -->
            <button onclick="document.getElementById('importFile').click()">Import</button>
            <button onclick="clearLocalHistory()">Clear All</button>
        </div>
        <!-- Hidden file input for import -->
        <input type="file" id="importFile" accept=".json" style="display:none;">
    </div>
    <div id="historyList">
        <!-- History items loaded here -->
        <p style="padding: 1rem; text-align: center; color: var(--secondary-text);">Loading local sessions...</p>
    </div>
</div>

<div class="modal-overlay" id="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <p class="modal-title">DATA STREAM // ai-nspired</p>
            <button class="close-modal" id="close-modal">×</button>
        </div>
        <div class="result-container" id="resultContainer">
            <!-- Content will be injected here -->
        </div>
        <div class="modal-footer" id="modalFooter">
            <button id="copyAnalysisBtn">Copy Analysis</button>
            <button id="ttsBtn">TTS (Read Aloud)</button>
            <button id="followUpBtn">Follow-Up</button>
        </div>
    </div>
</div>

<!-- Custom Message/Toast Box -->
<div id="customMessage"></div>

<script>
// --- Global Constants & State ---
const API_URL = 'https://justice.ai-n.workers.dev/api/ai/truth';
const LOCAL_STORAGE_KEY = 'LOCAL_TRUTH_HISTORY';
const MAX_HISTORY_ITEMS = 20;

let localHistory = []; // Array of session objects
let currentSessionId = null;
let lastQuery = ''; 

// --- DOM Elements ---
const queryInput = document.getElementById('queryInput');
const modalOverlay = document.getElementById('modal-overlay');
const closeModalBtn = document.getElementById('close-modal');
const resultContainer = document.getElementById('resultContainer');
const copyAnalysisBtn = document.getElementById('copyAnalysisBtn');
const ttsBtn = document.getElementById('ttsBtn');
const followUpBtn = document.getElementById('followUpBtn');
const body = document.body;
const customMessage = document.getElementById('customMessage');
const typedTextEl = document.getElementById('typedText');
const historyPanel = document.getElementById('historyPanel');
const historyToggle = document.getElementById('historyToggle');
const closeHistoryBtn = document.getElementById('closeHistoryBtn');
const historyList = document.getElementById('historyList');
const importFile = document.getElementById('importFile');


// --- Local Storage Utilities ---

/**
 * Loads the history array from localStorage into the global 'localHistory' state.
 */
function loadLocalHistoryFromStorage() {
    try {
        const storedData = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (storedData) {
            localHistory = JSON.parse(storedData);
        } else {
            localHistory = [];
        }
    } catch (e) {
        console.error("Error loading local storage history:", e);
        showMessage("Error accessing local history.", 3000);
        localHistory = [];
    }
}

/**
 * Saves the global 'localHistory' state back to localStorage, limiting the size.
 */
function saveLocalHistoryToStorage() {
    // Sort by timestamp (newest first) before saving
    localHistory.sort((a, b) => b.timestamp - a.timestamp);
    
    // Cap the history list size
    if (localHistory.length > MAX_HISTORY_ITEMS) {
        localHistory = localHistory.slice(0, MAX_HISTORY_ITEMS);
    }
    
    try {
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(localHistory));
        displayLocalHistoryInPanel(); // Refresh the visible panel immediately
    } catch (e) {
        console.error("Error saving local storage history:", e);
        showMessage("Local storage is full or disabled. Cannot save new session.", 4000);
    }
}

/**
 * Renders the history list items in the side panel.
 */
function displayLocalHistoryInPanel() {
    historyList.innerHTML = '';
    
    if (localHistory.length === 0) {
        historyList.innerHTML = `<p style="padding: 1rem; text-align: center; color: var(--secondary-text);">No local sessions saved yet.</p>`;
        return;
    }

    localHistory.forEach(session => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.dataset.sessionId = session.id;
        
        // Ensure timestamp is a number for conversion
        const timestamp = typeof session.timestamp === 'string' ? new Date(session.timestamp).getTime() : session.timestamp;
        const date = new Date(timestamp).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});

        item.innerHTML = `
            <p title="${session.initialQuery}">${session.initialQuery}</p>
            <small>${date} • ${session.turns?.length || 1} turns</small>
        `;
        item.addEventListener('click', () => loadLocalHistoryItem(session.id));
        historyList.appendChild(item);
    });
}

/**
 * Clears all local history data after a confirmation.
 */
function clearLocalHistory() {
    if(confirm("Are you sure you want to delete all locally saved truth sessions? This cannot be undone.")) {
        localStorage.removeItem(LOCAL_STORAGE_KEY);
        localHistory = [];
        currentSessionId = null;
        displayLocalHistoryInPanel();
        showMessage("Local history successfully cleared.", 3000);
    }
}

/**
 * Finds a session by ID and loads its content into the modal.
 * @param {string} sessionId - The unique ID of the session to load.
 */
function loadLocalHistoryItem(sessionId) {
    const sessionData = localHistory.find(s => s.id === sessionId);

    if (!sessionData) {
        return showMessage("Local session not found.", 3000);
    }

    closeModal();
    toggleHistoryPanel(); // Close history panel
    openModal();
    resultContainer.innerHTML = ''; // Clear previous content

    currentSessionId = sessionId;
    lastQuery = sessionData.initialQuery;

    sessionData.turns.forEach((turn, index) => {
        const isInitial = index === 0;
        const queryLabel = isInitial ? `Initial Query: "${turn.query}"` : `Follow-up ${index} on "${sessionData.initialQuery}"`;
        const responseLabel = isInitial ? `Response 1 (Initial)` : `Response ${index + 1} (Follow-up)`;

        let htmlContent = turn.answer ? marked.parse(turn.answer) : '<p>No results found.</p>';
        if(turn.citations?.length){
            htmlContent += `<div class="citation-block"><h3>Sources</h3><ul>${turn.citations.map(c=>`<li><a href="${c.uri}" target="_blank">${c.title || c.uri}</a></li>`).join('')}</ul></div>`;
        }

        const finalBlock = `
            <div class="conversation-block">
                <h4>${queryLabel}</h4>
                <div class="content">
                    <h4 style="color: var(--secondary-text);">${responseLabel}</h4>
                    ${htmlContent}
                </div>
            </div>`;
        resultContainer.innerHTML += finalBlock;
    });
    resultContainer.scrollTo(0, resultContainer.scrollHeight);
}

/**
 * Exports the entire local history as a downloadable JSON file.
 */
function exportHistoryToFile() {
    loadLocalHistoryFromStorage(); // Ensure state is synced
    if (localHistory.length === 0) {
        return showMessage("No history to export.", 3000);
    }
    
    try {
        const dataStr = JSON.stringify(localHistory, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        
        // Create a temporary link element
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        
        a.href = url;
        const timestamp = new Date().toISOString().slice(0, 10);
        a.download = `truth_engine_history_${timestamp}.json`;
        
        // Simulate click and cleanup
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        showMessage("History exported successfully!", 3000);
    } catch (e) {
        console.error("Error exporting history:", e);
        showMessage("Export failed due to file or storage error.", 4000);
    }
}


// --- Mode Functions, Modal Functions, etc. ---
function setMode(mode){
    if(mode==='silvery'){ body.setAttribute('data-mode',''); } 
    else { body.setAttribute('data-mode', mode); }
}

function openModal(){ modalOverlay.classList.add('active'); }
function closeModal(){ 
    modalOverlay.classList.remove('active'); 
    if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        ttsBtn.innerText='TTS (Read Aloud)';
    }
}

function showMessage(message, duration=2000){
    customMessage.innerText = message;
    customMessage.classList.add('visible');
    setTimeout(() => {
        customMessage.classList.remove('visible');
    }, duration);
}

function copyAnalysisToClipboard(){
    document.execCommand('copy', false, resultContainer.innerText);
    showMessage('Analysis Copied to Clipboard!');
}

function readAnalysisAloud(){
    if(!('speechSynthesis' in window)){ 
        showMessage('Text-to-Speech not supported in this browser.');
        return; 
    }
    
    if(window.speechSynthesis.speaking){ 
        window.speechSynthesis.cancel(); 
        ttsBtn.innerText='TTS (Stopped)'; 
        setTimeout(()=>ttsBtn.innerText='TTS (Read Aloud)',1000); 
        return; 
    }
    
    const conversationText = Array.from(resultContainer.querySelectorAll('.content')).map(el => el.innerText).join('\n---\n');
    
    const utterance = new SpeechSynthesisUtterance(conversationText.replace(/(\n|\t)/g,' '));
    utterance.rate=1.1;
    ttsBtn.innerText='TTS (Speaking...)';
    
    utterance.onend=()=>{
        ttsBtn.innerText='TTS (Read Aloud)';
        showMessage('Read-aloud complete.');
    }
    setTimeout(()=>{window.speechSynthesis.speak(utterance);},100);
}

// --- Query Function (Local Storage persistence) ---
async function performTruthQuery(query, isFollowUp=false){
    if(!query) return;
    
    let queryCount = 1;
    let sessionToUpdate;

    if (!isFollowUp || !currentSessionId) {
        // Start a NEW session
        lastQuery = query; 
        currentSessionId = crypto.randomUUID();
        sessionToUpdate = {
            id: currentSessionId,
            initialQuery: query,
            timestamp: Date.now(),
            turns: []
        };
        localHistory.unshift(sessionToUpdate); // Add new session to the beginning
    } else {
        // Continue an existing session
        sessionToUpdate = localHistory.find(s => s.id === currentSessionId);
        if (!sessionToUpdate) {
            return showMessage("Error: Follow-up failed. Session not found locally.", 4000);
        }
        queryCount = sessionToUpdate.turns.length + 1;
    }

    openModal();
    
    const tempLoadingId = `loading-${Date.now()}`;
    const queryLabel = isFollowUp ? `Follow-up ${queryCount} on "${lastQuery}"` : `Initial Query: "${query}"`;

    const loadingHtml = `
        <div class="conversation-block" id="${tempLoadingId}">
            <h4>${queryLabel}</h4>
            <div class="content">
                <p>⚡ Scanning truth matrix...</p>
            </div>
        </div>`;

    resultContainer.innerHTML += loadingHtml;
    resultContainer.scrollTo(0, resultContainer.scrollHeight); 

    try{
        const res = await fetch(API_URL,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({query})
        });
        if(!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        const data = await res.json();
        
        const newTurn = {
            query: query,
            answer: data.answer || '',
            citations: data.citations || [],
            timestamp: Date.now(),
            isFollowUp: isFollowUp
        };
        
        // Add new turn to the session object in memory
        sessionToUpdate.turns.push(newTurn);
        
        // Save the updated session history array back to local storage
        saveLocalHistoryToStorage(); 

        const loadingBlock = document.getElementById(tempLoadingId);
        if(loadingBlock) loadingBlock.remove();

        let htmlContent = newTurn.answer ? marked.parse(newTurn.answer) : '<p>No results found.</p>';
        if(newTurn.citations?.length){
            htmlContent += `<div class="citation-block"><h3>Sources</h3><ul>${newTurn.citations.map(c=>`<li><a href="${c.uri}" target="_blank">${c.title || c.uri}</a></li>`).join('')}</ul></div>`;
        }

        const finalBlock = `
            <div class="conversation-block">
                <h4>${isFollowUp ? `Response ${queryCount} (Follow-up)` : `Response ${queryCount} (Initial)`}</h4>
                <div class="content">
                    ${htmlContent}
                </div>
            </div>`;
        
        resultContainer.innerHTML += finalBlock;
        resultContainer.scrollTo(0, resultContainer.scrollHeight);

    } catch(err){
        const loadingBlock = document.getElementById(tempLoadingId);
        if(loadingBlock) loadingBlock.remove();
        
        resultContainer.innerHTML += `
            <div class="conversation-block">
                <h4>System Error</h4>
                <div class="content" style="border-left-color: red; color: red;">
                    <h3>System Error</h3><p>Query failed: ${err.message}</p>
                </div>
            </div>`;
        resultContainer.scrollTo(0, resultContainer.scrollHeight); 
        console.error("API Error:", err);
        showMessage("Query failed.", 3000);
    }
}

// --- Event Listeners ---
queryInput.addEventListener('keypress', e=>{
    if(e.key==='Enter'){
        const query = queryInput.value.trim();
        if (query === '') return;
        
        const isFollowUp = query.includes('→');
        
        // Logic to handle follow-up queries and new queries
        if (isFollowUp && lastQuery && query.startsWith(lastQuery + ' →')) {
            const followUpQuery = query.substring(lastQuery.length + 3).trim(); 
            performTruthQuery(followUpQuery, true);
        } else if (isFollowUp && !currentSessionId) {
            showMessage("Cannot follow up without an active or loaded session.", 3000);
            return;
        } else {
            // Fresh query (resets currentSessionId internally)
            performTruthQuery(query, false);
        }
        
        queryInput.value = '';
    }
});

closeModalBtn.addEventListener('click',closeModal);
modalOverlay.addEventListener('click', e=>{if(e.target===modalOverlay) closeModal();});
copyAnalysisBtn.addEventListener('click',copyAnalysisToClipboard);
ttsBtn.addEventListener('click',readAnalysisAloud);

followUpBtn.addEventListener('click', ()=>{
    closeModal(); 
    // Start the follow-up input with the previous query prefix
    queryInput.value = lastQuery ? lastQuery + ' → ' : '';
    queryInput.focus();
});


/**
 * Toggles the history panel open or closed.
 */
function toggleHistoryPanel() {
    if (historyPanel.classList.contains('open')) {
        historyPanel.classList.remove('open');
    } else {
        loadLocalHistoryFromStorage();
        displayLocalHistoryInPanel(); // Render the content before showing
        historyPanel.classList.add('open');
    }
}

// History Panel Toggle (both buttons now use the toggle function)
historyToggle.addEventListener('click', toggleHistoryPanel);
closeHistoryBtn.addEventListener('click', toggleHistoryPanel);


// Handle History Import via hidden file input
importFile.addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const importedData = JSON.parse(e.target.result);
            
            // Basic validation: Check if it's an array of objects that look like sessions
            if (!Array.isArray(importedData) || importedData.length === 0 || 
                !importedData.every(item => typeof item === 'object' && item.id && Array.isArray(item.turns))) {
                throw new Error("Invalid file structure. File must contain a list of truth sessions.");
            }
            
            // Overwrite local storage and update state
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(importedData));
            
            // Reload all state and UI
            loadLocalHistoryFromStorage();
            displayLocalHistoryInPanel();
            
            showMessage(`Successfully imported ${importedData.length} sessions!`, 4000);
            toggleHistoryPanel(); 
        } catch (error) {
            console.error("Error importing file:", error);
            showMessage(`Import failed: ${error.message}`, 5000);
        }
    };
    reader.readAsText(file);
    // Clear the input value so the same file can be loaded again
    event.target.value = null; 
});


// Initialize query from URL and start typing animation
window.addEventListener('load', ()=>{
    // Initialize color mode for the history panel hover effect
    setMode(body.getAttribute('data-mode')); 
    
    loadLocalHistoryFromStorage(); // Load initial data on startup

    const params = new URLSearchParams(window.location.search);
    const q = params.get('q');
    if(q){ 
        queryInput.value = decodeURIComponent(q.replace(/\+/g,' ')).trim(); 
        performTruthQuery(queryInput.value); 
        queryInput.value = '';
    }
    
    // Start the typing animation
    typedTextEl.classList.add('is-typing');

    typedTextEl.addEventListener('animationend', (e) => {
        if (e.animationName === 'typing') {
            typedTextEl.classList.remove('is-typing');
            typedTextEl.classList.add('is-done');
        }
    }, { once: true });
});
</script>
