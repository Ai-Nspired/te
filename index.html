<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truth Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #fff; font-family: monospace; height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    .card { width: 100%; max-width: 860px; border: 1px solid rgba(250,204,21,.2); border-radius: 12px; display: flex; flex-direction: column; height: calc(100dvh - 32px); }
    .header { padding: 12px 20px; text-align: center; font-size: 18px; border-bottom: 1px solid rgba(250,204,21,.2); color: #facc15; letter-spacing: 2px; text-transform: uppercase; flex-shrink: 0; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(250,204,21,.2); border-radius: 4px; }
    .msg-wrap { display: flex; flex-direction: column; gap: 4px; }
    .msg-wrap.user { align-items: flex-end; }
    .msg-wrap.assistant { align-items: flex-start; }
    .msg { padding: 10px 14px; border-radius: 10px; max-width: 80%; line-height: 1.6; font-size: 14px; }
    .msg.user { background: rgba(250,204,21,.12); border: 1px solid rgba(250,204,21,.25); white-space: pre-wrap; }
    .msg.assistant { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); }
    .msg.thinking { color: #facc15; font-style: italic; font-size: 13px; animation: pulse 1.5s infinite; border: none; background: none; padding-left: 0; }
    .msg.assistant p { margin-bottom: 8px; }
    .msg.assistant p:last-child { margin-bottom: 0; }
    .msg.assistant h1,.msg.assistant h2,.msg.assistant h3 { color: #facc15; margin: 10px 0 4px; font-size: 15px; }
    .msg.assistant ul,.msg.assistant ol { padding-left: 18px; margin-bottom: 8px; }
    .msg.assistant li { margin-bottom: 3px; }
    .msg.assistant code { background: rgba(250,204,21,.1); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
    .msg.assistant pre { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 6px; padding: 10px; overflow-x: auto; margin-bottom: 8px; }
    .msg.assistant pre code { background: none; padding: 0; }
    .msg.assistant blockquote { border-left: 2px solid #facc15; padding-left: 10px; color: #94a3b8; margin-bottom: 8px; }
    .msg.assistant strong { color: #facc15; }
    .copy-btn { font-size: 11px; color: #555; background: none; border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; align-self: flex-end; transition: color .2s; font-family: monospace; }
    .copy-btn:hover { color: #facc15; background: rgba(250,204,21,.08); }
    .copy-btn.copied { color: #22c55e; }
    @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
    .input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid rgba(250,204,21,.15); flex-shrink: 0; align-items: flex-end; }
    textarea { flex: 1; background: rgba(255,255,255,.04); border: 1px solid rgba(250,204,21,.3); border-radius: 8px; color: #fff; padding: 10px 12px; font-family: monospace; font-size: 14px; resize: none; outline: none; min-height: 44px; max-height: 160px; overflow-y: auto; line-height: 1.5; }
    textarea:focus { border-color: #facc15; }
    .send-btn { background: #facc15; color: #000; border: none; border-radius: 8px; width: 44px; height: 44px; font-size: 18px; font-weight: bold; cursor: pointer; flex-shrink: 0; display: grid; place-items: center; transition: opacity .2s; }
    .send-btn:hover { opacity: .85; }
    .send-btn:disabled { opacity: .3; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">Truth Engine</div>
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <textarea id="input" placeholder="Ask..." rows="1"
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
      <button class="send-btn" id="btn" onclick="send()">&#9166;</button>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://orproxy.ai-n.workers.dev";
    const messages = [];
    marked.setOptions({ breaks: true });

    function addMessage(role, text = "") {
      const wrap = document.createElement("div");
      wrap.className = "msg-wrap " + role;

      const div = document.createElement("div");
      div.className = "msg " + role;
      if (role === "assistant") div.innerHTML = marked.parse(text);
      else div.textContent = text;
      wrap.appendChild(div);

      if (role === "assistant") {
        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.textContent = "copy";
        btn.onclick = () => {
          navigator.clipboard.writeText(div.innerText).then(() => {
            btn.textContent = "copied!";
            btn.classList.add("copied");
            setTimeout(() => { btn.textContent = "copy"; btn.classList.remove("copied"); }, 2000);
          });
        };
        wrap.appendChild(btn);
      }

      document.getElementById("messages").appendChild(wrap);
      wrap.scrollIntoView({ behavior: "smooth" });
      return { wrap, div };
    }

    async function send() {
      const input = document.getElementById("input");
      const btn = document.getElementById("btn");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      input.style.height = "auto";
      btn.disabled = true;
      addMessage("user", text);
      messages.push({ role: "user", content: text });

      const { wrap: thinkWrap, div: thinkDiv } = addMessage("thinking", "thinking...");

      try {
        const res = await fetch(`${WORKER_URL}/api/generate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages, preset: "truth", stream: true })
        });

        thinkWrap.remove();
        const { wrap, div } = addMessage("assistant", "");
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let fullText = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const data = line.slice(6).trim();
            if (data === "[DONE]") break;
            try {
              const json = JSON.parse(data);
              const delta = json.choices?.[0]?.delta?.content || "";
              fullText += delta;
              div.innerHTML = marked.parse(fullText);
              wrap.scrollIntoView({ behavior: "smooth" });
            } catch {}
          }
        }

        messages.push({ role: "assistant", content: fullText });
      } catch (err) {
        thinkWrap.remove();
        addMessage("assistant", "Error: " + err.message);
      }

      btn.disabled = false;
      input.focus();
    }
  </script>
</body>
</html>
